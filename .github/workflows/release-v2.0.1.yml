name: Publish v2.0.1

on:
  workflow_run:
    workflows: ["CI"]
    types: [completed]
    branches: ["main"]

permissions:
  contents: write

jobs:
  release:
    if: >-
      ${{ github.event.workflow_run.conclusion == 'success'
          && github.event.workflow_run.head_branch == 'main'
          && github.event.workflow_run.head_repository.full_name == github.repository }}
    runs-on: ubuntu-latest
    steps:
      - name: Checkout CI-verified commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          persist-credentials: false

      - name: Publish v2.0.1 from successful main CI
        env:
          GH_TOKEN: ${{ github.token }}
          TARGET_SHA: ${{ github.event.workflow_run.head_sha }}
        run: |
          set -euo pipefail
          if gh release view v2.0.1 --repo "$GITHUB_REPOSITORY" >/dev/null 2>&1; then
            echo "v2.0.1 already published, nothing to do."
            exit 0
          fi
          test -f RELEASE_NOTES_v2.0.1.md
          gh release create v2.0.1 \
            --repo "$GITHUB_REPOSITORY" \
            --target "$TARGET_SHA" \
            --title "v2.0.1 — Safe Server Unregistration" \
            --notes-file RELEASE_NOTES_v2.0.1.md \
            --latest
